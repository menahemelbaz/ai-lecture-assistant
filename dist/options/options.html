<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Lecture Assistant — Settings</title>
    <link rel="stylesheet" href="options.css" />
</head>

<body>
    <main class="container">
        <h1 class="title">AI Lecture Assistant Settings</h1>

        <section class="card">
            <h2 class="section-title">OpenAI API Key</h2>

            <p class="description">
                This extension uses your personal OpenAI API key to transcribe lectures,
                answer questions, and generate summaries. Your key is stored only on your
                own device.
            </p>

            <div class="input-row">
                <input id="api-key-input" type="password" class="input" placeholder="sk-proj-..." autocomplete="off"
                    spellcheck="false" />
                <button id="toggle-visibility" class="icon-button" type="button" title="Show/hide">
                    👁
                </button>
            </div>

            <div class="actions">
                <button id="save-button" class="primary-button" type="button">
                    Save Key
                </button>
                <button id="clear-button" class="secondary-button" type="button">
                    Remove Key
                </button>
            </div>

            <p id="status-message" class="status" role="status"></p>

            <p class="help">
                Don't have a key? You can create one at
                <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">
                    platform.openai.com/api-keys
                </a>
            </p>
        </section>
    </main>

    <script src="options.js"></script>
</body>

</html>
